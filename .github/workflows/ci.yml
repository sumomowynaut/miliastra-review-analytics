name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试（零额外依赖）
        run: python -m unittest discover tests/ -v

      - name: 端到端（脱敏样例，零网络请求）
        run: |
          python src/analyze.py \
            --fixture fixtures/sample_chess_30.json \
            --outdir out \
            --domain-lexicon templates/domain_example.json

      - name: 校验产出
        run: |
          test -f "out/50105539813/千星奇域50105539813_数据报告.xlsx"
          test -f "out/50105539813/千星奇域50105539813_看板.html"
          echo "✅ 产出文件存在"

      - name: 看板自包含检查
        run: |
          python - <<'PY'
          import sys, glob
          sys.path.insert(0, "src")
          from dashboard import verify_dashboard
          fails = 0
          for p in glob.glob("out/**/*.html", recursive=True):
              issues = verify_dashboard(p)
              print(("✅" if not issues else "❌"), p, issues or "")
              fails += len(issues)
          sys.exit(1 if fails else 0)
          PY

      - name: 脱敏泄漏检查
        run: |
          python scripts/check_leaks.py

      - name: 确认数据产出未被提交
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^(out|data)/' ; then
            echo "❌ 数据产出目录被提交了"; exit 1
          fi
          echo "✅ 无数据产出入库"
